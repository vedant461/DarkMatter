services:
  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6379:6379"]
  demo-app:
    build:
      context: .
      dockerfile: Dockerfile.demo
    ports: ["8001:8000"]
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes: [".:/workspace"]
    ports: ["8000:8000"]
    depends_on: [falkordb, demo-app]
  frontend:
    build:
      context: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
