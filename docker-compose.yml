services:
  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  demo-app:
    build:
      context: .
      dockerfile: Dockerfile.demo
    ports: ["8001:8000"]
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes: [".:/workspace"]
    ports: ["8000:8000"]
    depends_on:
      falkordb:
        condition: service_healthy
      demo-app:
        condition: service_started
  frontend:
    build:
      context: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
